<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF6E9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="狗狗在哪裡">
<link rel="icon" href="../favicon.png">
<link rel="apple-touch-icon" href="../icon.png">

<title>狗狗在哪裡</title>
<meta name="description" content="Q 版狗狗邏輯解謎：每排、每欄、每個顏色都藏著一隻狗狗">
<style>
  /* 單一亮色主題：遊戲本身就是固定的奶油色畫面 */
  :root { --bg: #FFF6E9; color-scheme: light; }
  html, body { height: 100%; background: var(--bg); }
  body { overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  /* 關掉手機瀏覽器「點兩下放大」，不然快速點兩下放狗狗會被吃掉 */
  * { touch-action: manipulation; }
  /* 快速點兩下不要把文字反白、長按不要跳出選單 */
  * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  /* 輸入暱稱的框框還是要能打字 */
  input, textarea { -webkit-user-select: text; user-select: text; }
  #root { display: flex; height: 100%; flex: 1; }
</style>
</head>
<body>
<noscript>請開啟 JavaScript 才能玩喔。</noscript>
<div id="root"></div>
<script src="app.js?v=9456fe8c" defer></script>
</body>
</html>
